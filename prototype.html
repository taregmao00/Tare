<title>Tare GMAO</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout : appli mobile — en-tête collant, liste sur une colonne (max 640px), barre du chrono + onglets fixes en bas, fiches en panneau plein écran */
:root{
  --bg:#EEF1F0; --surface:#FFFFFF; --sunk:#E2E8E5; --ink:#15201D; --muted:#56655F; --line:#D3DBD8;
  --accent:#1F4F8F; --accent-ink:#FFFFFF; --accent-soft:#DCE6F4;
  --ok:#1C7543; --ok-soft:#DCF0E3; --warn:#8F5C06; --warn-soft:#F7EAD0; --crit:#B3261E; --crit-soft:#F8DDDA;
  --run:#0E3C2A; --run-ink:#E9F6EF;
  --paper:#FFFFFF; --paper-ink:#15201D; --paper-line:#D3DBD8;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --tabh:62px; --runh:0px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E1412; --surface:#17201D; --sunk:#202B28; --ink:#E5ECE9; --muted:#98A7A1; --line:#2B3733;
  --accent:#86AEEC; --accent-ink:#0E1A2E; --accent-soft:#1E2C44;
  --ok:#5CC98A; --ok-soft:#163222; --warn:#E5B552; --warn-soft:#352812; --crit:#F17A6F; --crit-soft:#3A1916;
  --run:#5CC98A; --run-ink:#0B1A12;
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0E1412; --surface:#17201D; --sunk:#202B28; --ink:#E5ECE9; --muted:#98A7A1; --line:#2B3733;
  --accent:#86AEEC; --accent-ink:#0E1A2E; --accent-soft:#1E2C44;
  --ok:#5CC98A; --ok-soft:#163222; --warn:#E5B552; --warn-soft:#352812; --crit:#F17A6F; --crit-soft:#3A1916;
  --run:#5CC98A; --run-ink:#0B1A12;
  color-scheme:dark }

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body.locked{overflow:hidden}
body.has-run{--runh:58px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-size:12.5px}
.tnum{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in,.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.brand{display:flex;align-items:baseline;gap:8px;min-width:0}
.brand b{font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:.02em;line-height:1}
.brand span{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 10px;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.sync.off i{background:var(--warn)}

main.wrap{padding-block:18px calc(var(--tabh) + var(--runh) + env(safe-area-inset-bottom,0px) + 88px)}
h1{font-family:var(--display);font-weight:700;font-size:30px;line-height:1.05;margin:0;text-wrap:balance}
h2{font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:0}
.sec{display:flex;flex-direction:column;gap:10px}
.page{display:flex;flex-direction:column;gap:22px}
.lede{color:var(--muted);margin:4px 0 0}

.counts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.count{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 10px 8px;text-align:left;cursor:pointer}
.count b{display:block;font-family:var(--display);font-size:28px;line-height:1;font-weight:700}
.count span{font-size:12px;color:var(--muted);font-weight:500}
.count.crit b{color:var(--crit)}
.count[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.list{display:flex;flex-direction:column;gap:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
button.card{display:block;width:100%;text-align:left;cursor:pointer}
button.card:active{background:var(--sunk)}
.card.live{border-color:var(--run);box-shadow:inset 3px 0 0 var(--run)}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0}
.iv-title{font-weight:600;font-size:16px;margin-top:4px}
.iv-sub{color:var(--muted);font-size:14px}
.iv-meta{margin-top:8px;font-size:13px;color:var(--muted)}
.empty{border:1px dashed var(--line);border-radius:10px;padding:14px;color:var(--muted);text-align:center;font-size:14px}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;line-height:1;padding:5px 8px;border-radius:999px;white-space:nowrap}
.st-afa{background:var(--warn-soft);color:var(--warn)}
.st-pri{background:var(--accent-soft);color:var(--accent)}
.st-enc{background:var(--run);color:var(--run-ink)}
.st-pau{background:var(--sunk);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.st-ter{background:var(--ok-soft);color:var(--ok)}
.st-fac{background:var(--sunk);color:var(--muted)}
.urg{background:var(--crit-soft);color:var(--crit)}
.pulse{width:7px;height:7px;border-radius:50%;background:currentColor}
@media (prefers-reduced-motion:no-preference){.pulse{animation:pl 1.4s ease-in-out infinite}@keyframes pl{50%{opacity:.25}}}

.vig{display:flex;align-items:center;gap:10px;border-radius:10px;padding:10px 12px;font-size:14px;font-weight:600}
.vig::before{content:"";flex:none;width:14px;height:18px;border-radius:3px;background:currentColor}
.vig.ok{background:var(--ok-soft);color:var(--ok)}
.vig.warn{background:var(--warn-soft);color:var(--warn)}
.vig.crit{background:var(--crit-soft);color:var(--crit)}
.vig small{display:block;font-weight:500;opacity:.9}
.dot{display:inline-block;width:8px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.crit{background:var(--crit)}

/* Chrono */
.clock{border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;background:var(--surface);border:1px solid var(--line)}
.clock.on{background:var(--run);color:var(--run-ink);border-color:var(--run)}
.clock .t{font-family:var(--mono);font-size:44px;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.clock .lbl{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;opacity:.8}
.clock .cost{display:flex;justify-content:space-between;gap:10px;font-size:14px;flex-wrap:wrap}
.clock .cost b{font-family:var(--display);font-size:22px;font-weight:700}
.clock .btn{border-color:currentColor;background:transparent;color:inherit}
.clock.on .btn.primary{background:var(--run-ink);color:var(--run);border-color:var(--run-ink)}
.clock-btns{display:grid;grid-template-columns:1fr 1.4fr;gap:8px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;border-radius:9px;border:1px solid var(--line);background:var(--surface);padding:0 16px;font-weight:600;cursor:pointer;text-align:center}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.go{background:var(--run);color:var(--run-ink);border-color:var(--run)}
.btn.block{width:100%}
.btn.small{min-height:36px;padding:0 12px;font-size:14px}
.link{background:none;border:0;padding:4px 0;color:var(--accent);font-weight:600;cursor:pointer;font-size:14px;text-align:left}
.actions{display:flex;flex-direction:column;gap:8px}
.stack{display:flex;flex-direction:column;gap:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld>span,legend{font-size:13px;font-weight:600;color:var(--muted)}
input:not([type=checkbox]):not([type=radio]):not([type=file]),select,textarea{width:100%;font-size:16px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-height:46px}
textarea{resize:vertical;min-height:96px}
fieldset{border:1px solid var(--line);border-radius:10px;padding:12px;margin:0;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
legend{padding:0 6px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14.5px;cursor:pointer}
.check input{width:20px;height:20px;margin-top:1px;flex:none;accent-color:var(--accent)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg label{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-weight:600;cursor:pointer}
.seg input{accent-color:var(--accent)}
.hint{font-size:13px;color:var(--muted);margin:0}
.hint.warn{color:var(--warn);font-weight:600}
.err{background:var(--crit-soft);color:var(--crit);border-radius:8px;padding:10px 12px;font-size:14px;font-weight:600;margin:0}
.file{position:relative;overflow:hidden;align-self:flex-start}
.file input{position:absolute;inset:0;opacity:0;cursor:pointer}
.thumbs{display:flex;flex-wrap:wrap;gap:8px}
.thumbs img{width:72px;height:72px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.sig{width:100%;height:150px;background:var(--paper);border:1px dashed var(--paper-line);border-radius:8px;touch-action:none;display:block}
.money{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:14.5px;margin:0}
.money dt{color:var(--muted)}
.money dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.money .tot{font-weight:700;color:var(--ink);border-top:1px solid var(--line);padding-top:6px}
.line{display:flex;flex-direction:column;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.line:first-child{border-top:0;padding-top:0}
.line-h{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14.5px;min-width:0}
.line-h input{flex:1;min-width:0}
.line-n{display:grid;grid-template-columns:1fr 1.3fr auto;gap:8px;align-items:end}
.line-n .link{padding-bottom:12px}
.addrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.tag{font-size:12px;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:2px 6px;white-space:nowrap}

.dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:14.5px}
.dl dt{color:var(--muted)}
.dl dd{margin:0;min-width:0;overflow-wrap:anywhere}
.block{display:flex;flex-direction:column;gap:8px}
.desc{margin:0;white-space:pre-wrap}
.journal{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;font-size:14px}
.journal li{display:grid;grid-template-columns:92px 1fr;gap:10px}
.journal time{color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums}

.paper{background:var(--paper);color:var(--paper-ink);border:1px solid var(--paper-line);border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:12px}
.paper h3{font-family:var(--display);font-size:22px;margin:0;line-height:1}
.paper .dl dt,.paper .money dt{color:#56655F}
.paper .money .tot{color:var(--paper-ink);border-color:var(--paper-line)}
.paper hr{border:0;border-top:1px solid var(--paper-line);margin:0}
.paper img.signature{max-width:240px;height:auto;border-bottom:1px solid var(--paper-line)}
.stamp{display:inline-flex;align-self:flex-start;font-size:12px;font-weight:600;border:1.5px solid currentColor;border-radius:4px;padding:3px 7px;text-transform:uppercase;letter-spacing:.06em}

/* Barre du chrono + onglets */
.runbar{position:fixed;left:0;right:0;z-index:6;bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px));background:var(--run);color:var(--run-ink)}
.runbar-in{max-width:640px;margin:0 auto;height:58px;display:flex;align-items:center;gap:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.runbar .open{flex:1;min-width:0;background:none;border:0;color:inherit;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:1px;padding:0}
.runbar .open span{font-size:12.5px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.runbar .open b{font-family:var(--mono);font-size:19px;font-weight:500;font-variant-numeric:tabular-nums}
.runbar .pp{flex:none;border:1.5px solid currentColor;background:transparent;color:inherit;border-radius:9px;min-height:40px;padding:0 14px;font-weight:600;cursor:pointer}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);height:var(--tabh);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--accent)}
.fab{position:fixed;z-index:6;right:max(16px,calc(env(safe-area-inset-right,0px) + 16px));bottom:calc(var(--tabh) + var(--runh) + env(safe-area-inset-bottom,0px) + 14px);background:var(--accent);color:var(--accent-ink);border:0;border-radius:14px;min-height:52px;padding:0 18px;font-weight:600;font-size:15px;box-shadow:0 6px 18px rgba(14,30,50,.25);cursor:pointer}

#sheet{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column}
#sheet[hidden]{display:none!important}
.sheet-bar{flex:none;background:var(--surface);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.sheet-bar .top-in{justify-content:flex-start}
.back{background:none;border:0;color:var(--accent);font-weight:600;cursor:pointer;padding:8px 4px;font-size:15px}
.sheet-title{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sheetScroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
#sheetBody{padding-block:18px calc(env(safe-area-inset-bottom,0px) + 40px)}
@media (prefers-reduced-motion:no-preference){ #sheet:not([hidden]){animation:slide .18s ease-out} @keyframes slide{from{transform:translateY(16px);opacity:.6}to{transform:none;opacity:1}} }

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabh) + var(--runh) + env(safe-area-inset-bottom,0px) + 80px);z-index:30;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:10px;font-weight:600;font-size:14px;width:max-content;max-width:calc(100% - 32px)}
.foot{font-size:13px;color:var(--muted);text-align:center;display:flex;flex-direction:column;gap:4px;align-items:center}
@media (max-width:370px){ .counts{grid-template-columns:repeat(2,1fr)} .grid2{grid-template-columns:1fr} }
</style>

<header class="top"><div class="top-in">
  <div class="brand"><b>Tare</b><span id="who"></span></div>
  <button class="sync" id="sync" data-act="toggle-offline" type="button"></button>
</div></header>

<main class="wrap" id="main"></main>

<button class="fab" data-act="new" type="button">+ Nouvelle demande</button>
<div class="runbar" id="runbar" hidden></div>

<nav class="tabs" aria-label="Sections"><div class="tabs-in">
  <button class="tab" data-act="tab" data-tab="int" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1.3" fill="currentColor"/><circle cx="4.5" cy="12" r="1.3" fill="currentColor"/><circle cx="4.5" cy="18" r="1.3" fill="currentColor"/></svg>Interventions</button>
  <button class="tab" data-act="tab" data-tab="parc" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 19h16M6 19l1.5-8h9L18 19M12 11V7M8 7h8"/></svg>Parc</button>
  <button class="tab" data-act="tab" data-tab="set" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg>Réglages</button>
</div></nav>

<section id="sheet" hidden aria-modal="true" role="dialog">
  <div class="sheet-bar"><div class="top-in"><button class="back" data-act="back" type="button">← Retour</button><span class="sheet-title" id="sheetTitle"></span></div></div>
  <div id="sheetScroll"><div class="wrap" id="sheetBody"></div></div>
</section>

<div class="toast" id="toast" role="status" hidden></div>

<script>
(function(){
const DAY=86400000,MIN=60000;
const T0=new Date();T0.setHours(0,0,0,0);
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const rel=n=>{const d=new Date(T0);d.setDate(d.getDate()+n);return iso(d)};
const parse=s=>{const p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])};
const until=s=>Math.round((parse(s)-T0)/DAY);
const fDay=new Intl.DateTimeFormat('fr-FR',{weekday:'short',day:'numeric',month:'short'});
const fLong=new Intl.DateTimeFormat('fr-FR',{day:'numeric',month:'long',year:'numeric'});
const fHead=new Intl.DateTimeFormat('fr-FR',{weekday:'long',day:'numeric',month:'long'});
const fEur=new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR'});
const dShort=s=>fDay.format(parse(s));
const dLong=s=>fLong.format(parse(s));
const hm=ts=>{const d=new Date(ts);return pad(d.getHours())+':'+pad(d.getMinutes())};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clockStr=ms=>{const s=Math.floor(ms/1000);return pad(Math.floor(s/3600))+':'+pad(Math.floor(s%3600/60))+':'+pad(s%60)};
const durStr=min=>{min=Math.round(min);const h=Math.floor(min/60),m=min%60;return h?(h+' h'+(m?' '+pad(m):'')):(m+' min')};

/* ---------- Données fictives ---------- */
function seed(){
  const now=Date.now();
  const j=(t,d,h)=>({d:d||rel(0),h:h||'08:00',t});
  const startRun=now-38*MIN;
  return {v:2,seq:1048,bonSeq:154,
  settings:{me:'k',rate:65,dep:{l1:20,l2:50,p1:50,p2:80,p3:120}},
  catalogue:[
    {code:'1',des:'Câble de capteur blindé 4 fils (le mètre)',pu:4.5},
    {code:'2',des:'Capteur de pesage 2 t inox',pu:185},
    {code:'3',des:'Bloc alimentation indicateur 12 V',pu:62}],
  techs:[
    {id:'k',name:'Karim B.',role:'Technicien',habil:true},
    {id:'l',name:'Lucas M.',role:'Technicien',habil:false},
    {id:'s',name:'Sophie R.',role:'Cheffe d’agence',habil:true}],
  clients:[
    {id:'c1',dist:18,name:'Carrière Ferrand',site:'Carrière de la Garrigue',addr:'Chemin des Plâtrières, Villeneuve',contact:'Resp. maintenance · 06 00 00 00 01',critique:true,note:'Un seul pont-bascule : expéditions à l’arrêt en cas de panne'},

  if(v.statut==='attente')return{cls:'crit',l:'À vérifier : usage réglementé interdit',s:v.motif||'Vérification obligatoire avant remise en service'};

/* ---------- Chrono ---------- */
function canDo(iv){
  const me=ME();
  if(iv.type==='Vérification'&&!me.habil){toast(me.name+' n’est pas habilité aux vérifications');return false}
  return true;
}
function startTimer(iv){
  if(!canDo(iv))return;
  const other=myLive();
  if(other&&other.id!==iv.id){other.segs[other.segs.length-1].e=Date.now();log(other,'Chrono mis en pause (départ sur '+iv.id+')')}
  const first=!iv.segs.length;
  iv.tech=db.settings.me;iv.statut='en_cours';iv.segs.push({s:Date.now(),e:null});
  log(iv,first?'Chrono démarré par '+ME().name:'Chrono repris');
  save();refresh();toast(other&&other.id!==iv.id?other.id+' mise en pause, chrono lancé sur '+iv.id:'Chrono lancé');
}
function pauseTimer(iv){if(!running(iv))return;iv.segs[iv.segs.length-1].e=Date.now();log(iv,'Chrono mis en pause');save();refresh()}

function clockBlock(iv,mine){
  const on=running(iv),ms=elapsed(iv),r=db.settings.rate;
  return `<div class="clock ${on?'on':''}">
    <span class="lbl">${on?'Chrono en cours':'Chrono en pause'}${!mine&&iv.tech?' · '+esc(TECH(iv.tech).name):''}</span>

    <div class="cost"><span>Main-d’œuvre estimée<br><small data-tick="${iv.id}" data-k="billed">${durStr(billed(ms/MIN))} facturé · ${r} €/h</small></span><b data-tick="${iv.id}" data-k="cost">${fEur.format(cost(billed(ms/MIN),r))}</b></div>

function moRows(mesure,corr,r,tr,lines){
  const base=corr!=null?corr:mesure,b=billed(base),mo=cost(b,r);
  let out=`<dt>Chrono</dt><dd>${durStr(mesure)}</dd>
    ${corr!=null?`<dt>Temps corrigé</dt><dd>${durStr(corr)}</dd>`:''}
    <dt>Temps facturé</dt><dd>${durStr(b)}</dd>`;
  if(!tr)return out+`<dt>${num((b/60).toFixed(2))} h × ${num(r)} €</dt><dd></dd><dt class="tot">Main-d’œuvre HT</dt><dd class="tot">${fEur.format(mo)}</dd>`;
  const d=travel(tr);
  return out+`<dt>Main-d’œuvre : ${num((b/60).toFixed(2))} h × ${num(r)} €</dt><dd>${fEur.format(mo)}</dd>
    <dt>Déplacement : forfait ${tr.label} (${tr.km} km)</dt><dd>${fEur.format(d)}</dd>
    ${lineRows(lines)}<dt class="tot">Total HT</dt><dd class="tot">${fEur.format(mo+d+linesTot(lines))}</dd>`;
}

const sheetEl=document.getElementById('sheet');

function runbar(){
  const el=document.getElementById('runbar');
  const iv=myLive()||myOpen()[0];
  const top=ui.stack[ui.stack.length-1];
  const hide=!iv||(top&&top.k==='bonform');
  el.hidden=hide;document.body.classList.toggle('has-run',!hide);
  if(hide)return;
  const on=running(iv),c=C(iv.clientId);
  el.style.background=on?'':'var(--ink)';el.style.color=on?'':'var(--bg)';
  el.innerHTML=`<div class="runbar-in"><button class="open" type="button" data-act="open-int" data-id="${iv.id}"><span>${on?'En cours':'En pause'} · ${esc(c.name)} · ${iv.id}</span><b><span data-tick="${iv.id}" data-k="clock">${clockStr(elapsed(iv))}</span> · <span data-tick="${iv.id}" data-k="cost">${fEur.format(cost(billed(elapsed(iv)/MIN),db.settings.rate))}</span></b></button>
    <button class="pp" type="button" data-act="${on?'pause':'start'}" data-id="${iv.id}">${on?'Pause':'Reprendre'}</button></div>`;
}
function render(){
  hdr();
  const m=document.getElementById('main');
  m.innerHTML=ui.tab==='int'?vInterventions():ui.tab==='parc'?vParc():vSettings();
  document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-current',t.dataset.tab===ui.tab?'page':'false'));

function renderSheet(){
  const top=ui.stack[ui.stack.length-1];
  if(!top){sheetEl.hidden=true;document.body.classList.remove('locked');runbar();return}
  let title='',html='';
  if(top.k==='int'){const iv=INT(top.id);title=iv.id;html=vIntDetail(iv)}
  else if(top.k==='inst'){const i=I(top.id);title=i.id;html=vInst(i)}
  else if(top.k==='bonform'){title='Bon d’intervention';html=vBonForm(INT(top.id))}
  else if(top.k==='bon'){const iv=INT(top.id);title=iv.bon.numero;html=vBon(iv)}
  else if(top.k==='new'){title='Nouvelle demande';html=vNew(top.inst)}
  document.getElementById('sheetTitle').textContent=title;
  document.getElementById('sheetBody').innerHTML=html;
  sheetEl.hidden=false;document.body.classList.add('locked');
  runbar();
  if(top.k==='bonform')requestAnimationFrame(setupSig);
}
function refresh(){const top=ui.stack[ui.stack.length-1];if(top&&top.k!=='bonform')renderSheet();render()}
function push(x){ui.stack.push(x);renderSheet();document.getElementById('sheetScroll').scrollTop=0}
function pop(){ui.stack.pop();renderSheet();render()}
let tt;
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.hidden=false;clearTimeout(tt);tt=setTimeout(()=>{el.hidden=true},3400)}

/* Mise à jour des chronos chaque seconde, sans redessiner les formulaires */
setInterval(()=>{
  document.querySelectorAll('[data-tick]').forEach(el=>{
    const iv=INT(el.dataset.tick);if(!iv||!running(iv))return;
    const ms=elapsed(iv),k=el.dataset.k;
    if(k==='clock')el.textContent=clockStr(ms);
    else if(k==='cost')el.textContent=fEur.format(cost(billed(ms/MIN),db.settings.rate));
    else if(k==='billed')el.textContent=durStr(billed(ms/MIN))+' facturé · '+db.settings.rate+' €/h';
  });
},1000);

function setupSig(){
  const c=document.getElementById('sig');if(!c)return;
  const r=c.getBoundingClientRect(),dpr=window.devicePixelRatio||1;
  c.width=Math.max(1,Math.round(r.width*dpr));c.height=Math.max(1,Math.round(r.height*dpr));
  const x=c.getContext('2d');x.scale(dpr,dpr);x.lineWidth=2.2;x.lineCap='round';x.lineJoin='round';
  x.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--paper-ink').trim()||'#15201D';
  sig={has:false,c};let drawing=false;
  const pt=e=>{const b=c.getBoundingClientRect();return[e.clientX-b.left,e.clientY-b.top]};
  c.onpointerdown=e=>{drawing=true;try{c.setPointerCapture(e.pointerId)}catch(_){}const p=pt(e);x.beginPath();x.moveTo(p[0],p[1]);x.lineTo(p[0]+.1,p[1]+.1);x.stroke();sig.has=true};
  c.onpointermove=e=>{if(!drawing)return;const p=pt(e);x.lineTo(p[0],p[1]);x.stroke()};
  c.onpointerup=c.onpointercancel=()=>{drawing=false};
}
function updMo(){
  const f=document.querySelector('form[data-form="bon"]');if(!f)return;
  const iv=INT(f.dataset.id),mesure=Math.round(elapsed(iv)/MIN);
  const corr=f.corr.checked?Math.max(1,Number(f.corrMin.value)||0):null;
  document.getElementById('mo').innerHTML=moRows(mesure,corr,db.settings.rate,trNow(Math.max(0,Number(f.km.value)||0)),ui.lines[iv.id]);
}

  take:d=>{const iv=INT(d.id);if(!canDo(iv))return;iv.tech=db.settings.me;iv.statut='prise';log(iv,'Prise par '+ME().name);save();refresh();toast(iv.id+' ajoutée à tes interventions')},
  release:d=>{const iv=INT(d.id);iv.tech=null;iv.statut='a_faire';log(iv,'Libérée par '+ME().name);save();refresh();toast(iv.id+' remise dans « À faire »')},
  start:d=>startTimer(INT(d.id)),
  pause:d=>{pauseTimer(INT(d.id));toast('Chrono en pause')},
  finish:d=>{const iv=INT(d.id);if(running(iv)){iv.segs[iv.segs.length-1].e=Date.now();log(iv,'Chrono arrêté ('+durStr(elapsed(iv)/MIN)+')')}save();push({k:'bonform',id:iv.id});render()},
  'view-bon':d=>push({k:'bon',id:d.id}),
  'add-ref':d=>{const a=db.catalogue.find(x=>x.code===document.getElementById('add-ref').value);if(!a)return;const L=ui.lines[d.id];const ex=L.find(l=>l.kind==='ref'&&l.code===a.code);if(ex)ex.qty=(Number(ex.qty)||0)+1;else L.push({kind:'ref',code:a.code,des:a.des,qty:1,pu:a.pu});drawLines(d.id)},
  'add-petit':d=>{ui.lines[d.id].push({kind:'petit',des:'',qty:1,pu:0});drawLines(d.id);const n=ui.lines[d.id].length-1,el=document.getElementById('ln-des-'+n);if(el)el.focus()},
  'add-conso':d=>{ui.lines[d.id].push({kind:'petit',des:'Forfait consommables',qty:1,pu:15});drawLines(d.id)},
  'del-line':d=>{ui.lines[d.id].splice(Number(d.i),1);drawLines(d.id)},
  invoice:d=>{const iv=INT(d.id);iv.statut='facturee';log(iv,'Marquée facturée');save();refresh();toast(iv.id+' marquée facturée')},
  'sig-clear':()=>{const c=sig.c;if(!c)return;c.getContext('2d').clearRect(0,0,c.width,c.height);sig.has=false},
  'toggle-offline':()=>{
    if(ui.offline){ui.offline=false;const n=ui.pending;ui.pending=0;db.interventions.forEach(x=>{if(x.bon)x.bon.synced=true});save();hdr();toast(n?n+' bon'+(n>1?'s':'')+' synchronisé'+(n>1?'s':''):'Réseau retrouvé')}
    else{ui.offline=true;hdr();toast('Hors ligne simulé : le chrono et les bons continuent sur le téléphone')}
    const top=ui.stack[ui.stack.length-1];if(top&&top.k==='bon')renderSheet();
  },
  'new-verif':d=>{const inst=I(d.id);const iv=createInt({type:'Vérification',clientId:inst.clientId,instId:inst.id,prio:inst.vp.statut==='verte'&&until(inst.vp.echeance)>=0?'normale':'urgente',desc:'Vérification périodique : échéance '+(inst.vp.echeance?dLong(inst.vp.echeance):'à définir')+'.'});save();render();toast(iv.id+' créée dans « À faire »')},
  reset:()=>{if(!ui.resetArm){ui.resetArm=true;render();return}db=seed();ui.resetArm=false;ui.photos={};ui.pending=0;ui.filter='all';save();render();toast('Démo réinitialisée')}
};
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  if(b.dataset.act==='new-verif')e.stopPropagation();
  const f=acts[b.dataset.act];if(f){e.preventDefault();f(b.dataset,b)}
},true);

const forms={
  new:f=>{const fd=new FormData(f);const iv=createInt({type:fd.get('type'),clientId:fd.get('client'),instId:fd.get('inst'),prio:fd.get('prio'),desc:(fd.get('desc')||'').trim()||'Demande sans description.',duree:fd.get('duree'),pers:Number(fd.get('pers'))});
    save();ui.stack=[{k:'int',id:iv.id}];renderSheet();render();toast(iv.id+' créée dans « À faire »')},
  settings:()=>{},
  bon:f=>{
    const iv=INT(f.dataset.id),inst=I(iv.instId),c=C(iv.clientId),fd=new FormData(f);
    const travaux=(fd.get('travaux')||'').trim(),signataire=(fd.get('signataire')||'').trim(),err=[];
    const mesure=Math.round(elapsed(iv)/MIN);
    let correction=null;
    if(f.corr.checked){const m=Math.round(Number(fd.get('corrMin'))||0),mo=(fd.get('corrMotif')||'').trim();
      if(m<1)err.push('indique le temps réel');if(!mo)err.push('indique le motif de la correction');correction={min:m,motif:mo}}
    const L=(ui.lines[iv.id]||[]).filter(l=>Number(l.qty)>0).map(l=>({...l,des:String(l.des||'').trim()}));
    if(L.some(l=>l.kind==='petit'&&!l.des))err.push('donne une désignation au petit matériel');
    if(!travaux)err.push('décris les travaux réalisés');
    if(iv.type==='Vérification'&&!fd.get('resultat'))err.push('indique le résultat');
    if(!signataire)err.push('indique le nom du signataire');
    if(!sig.has)err.push('fais signer le client');
    const eb=document.getElementById('bon-err');
    if(err.length){eb.textContent='Avant de valider : '+err.join(', ')+'.';eb.hidden=false;eb.scrollIntoView({block:'center'});return}
    if(running(iv))iv.segs[iv.segs.length-1].e=Date.now();
    const now=new Date();
    const bon={numero:'BI-'+T0.getFullYear()+'-'+String(db.bonSeq++).padStart(4,'0'),date:iso(now),heure:hm(now),tech:iv.tech,travaux,
      mesure,facture:billed(correction?correction.min:mesure),rate:db.settings.rate,correction,
      km:Number(fd.get('km')||0),dep:zoneOf(Number(fd.get('km')||0)).p,depL:zoneOf(Number(fd.get('km')||0)).l,pieces:'',lines:L,metro:fd.get('metro')==='on',
      resultat:fd.get('resultat')||null,echeance:fd.get('echeance')||null,signataire,sig:sig.c.toDataURL('image/png'),photos:(ui.photos[iv.id]||[]).length,synced:!ui.offline};
    iv.bon=bon;iv.statut='terminee';
    if(correction)log(iv,'Temps corrigé de '+durStr(mesure)+' à '+durStr(correction.min)+' : '+correction.motif);
    log(iv,'Bon '+bon.numero+' signé par '+signataire+' · total '+fEur.format(bonTotal(bon))+' HT');
    let msg='Bon '+bon.numero+' validé';
    if(iv.type==='Vérification'){
      if(bon.resultat==='conforme'){inst.vp={statut:'verte',echeance:bon.echeance||rel(365)};log(iv,'Vignette verte posée')}
      else{inst.vp={statut:'rouge',echeance:inst.vp.echeance};const n=createInt({type:'Réparation',clientId:c.id,instId:inst.id,prio:c.critique?'urgente':'normale',desc:'Remise en conformité après refus en vérification ('+bon.numero+').'});log(iv,'Vignette rouge posée, '+n.id+' créée');msg+=' · remise en conformité '+n.id+' créée'}
    }else if(bon.metro){
      const prim=iv.type==='Installation';
      inst.vp={statut:'attente',echeance:inst.vp.echeance,motif:prim?'Vérification primitive à réaliser':'Vérification après réparation à réaliser'};
      const n=createInt({type:'Vérification',clientId:c.id,instId:inst.id,prio:c.critique?'urgente':'normale',desc:(prim?'Vérification primitive':'Vérification après réparation')+' suite au bon '+bon.numero+'.'});
      log(iv,'Instrument passé « À vérifier », '+n.id+' créée');msg+=' · vérification '+n.id+' créée';
    }
    if(ui.offline)ui.pending++;
    save();ui.stack[ui.stack.length-1]={k:'bon',id:iv.id};renderSheet();render();toast(msg);
  }
};
document.addEventListener('submit',e=>{const f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();const h=forms[f.dataset.form];if(h)h(f)});

document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='bon-metro')document.getElementById('metro-hint').hidden=!t.checked;
  if(t.id==='bon-corr'){document.getElementById('corr-box').hidden=!t.checked;updMo()}
  if(t.name==='resultat'){const non=t.value==='non';document.getElementById('ech-fld').hidden=non;document.getElementById('ech-hint').hidden=non}
  if(t.id==='new-client'){const c=C(t.value);document.getElementById('new-inst').innerHTML=instOptions(c.id);
    const h=document.getElementById('new-crit');h.hidden=!c.critique;h.textContent=c.note||'Client critique';
    document.getElementById(c.critique?'new-p-u':'new-p-n').checked=true}
  if(t.id==='bon-photos'){const id=t.dataset.id;ui.photos[id]=ui.photos[id]||[];
    Array.from(t.files||[]).forEach(f=>{try{ui.photos[id].push(URL.createObjectURL(f))}catch(_){}});
    document.getElementById('thumbs').innerHTML=thumbs(id);t.value=''}
  if(t.closest&&t.closest('form[data-form="settings"]')){
    const s=db.settings;
    if(t.id==='set-me'){s.me=t.value;ui.filter='all'}
    if(t.id==='set-rate')s.rate=Math.max(0,Number(t.value)||0);
    if(/^set-[pl][123]$/.test(t.id)){const k=t.id.slice(4);s.dep[k]=Math.max(0,Number(t.value)||0);if(s.dep.l2<s.dep.l1)s.dep.l2=s.dep.l1}
    if(t.id==='set-round')s.round=Number(t.value);
    if(t.id==='set-min')s.minimum=Number(t.value);
    save();render();toast('Réglage enregistré');
  }
});
document.addEventListener('input',e=>{
  if(e.target.id==='q')document.getElementById('parc-list').innerHTML=parcList(e.target.value);
  if(e.target.id==='bon-corr-min'||e.target.id==='bon-km')updMo();
  const el=e.target;
  if(el.dataset&&el.dataset.line!==undefined){const f=el.closest('form[data-form="bon"]');if(!f)return;const l=(ui.lines[f.dataset.id]||[])[Number(el.dataset.line)];if(!l)return;const k=el.dataset.f;l[k]=k==='des'?el.value:Math.max(0,Number(el.value)||0);updMo()}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ui.stack.length)pop()});

render();
})();
</script>
